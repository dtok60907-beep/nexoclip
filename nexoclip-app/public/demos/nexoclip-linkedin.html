<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoClip — LinkedIn motion demo</title>
<style>body{margin:0;background:#101110;color:#eee;font:14px system-ui;display:grid;justify-items:center;gap:16px;padding:24px}canvas{width:min(100%,432px);border-radius:18px}button,a{background:#d4ff64;color:#101110;border:0;border-radius:24px;padding:12px 22px;font:inherit;cursor:pointer}p{max-width:480px;color:#aaa;text-align:center}button:disabled{opacity:.5}</style>
<canvas id="film" width="1080" height="1350" aria-label="Demo animasi NexoClip untuk LinkedIn"></canvas><button id="export">Ekspor video 30 detik (WebM)</button><p>Demo animasi UI, bukan rekaman layar. Tanpa audio; siap ditambahkan voice-over saat editing.</p><a id="download" hidden>Download video</a><p id="status" role="status"></p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('button'),status=document.querySelector('#status');let start=performance.now(),recording=false;
const lime='#d4ff64';
function text(value,x,y,size=30,color='#f5f5f5'){ctx.fillStyle=color;ctx.font=`${size>=50?600:400} ${size}px system-ui`;ctx.fillText(value,x,y)}
function box(x,y,w,h,color='#202320',radius=24){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,radius);ctx.fill()}
function lines(values,x,y,size=56,color='#f5f5f5'){values.forEach((v,i)=>text(v,x,y+i*size*1.25,size,color))}
function draw(t){ctx.fillStyle='#101310';ctx.fillRect(0,0,1080,1350);text('nexoclip',76,100,40,lime);text('DEMO ANIMASI',770,95,20,'#9da69b');box(76,1240,928,4,'#30372e',2);box(76,1240,928*t/30,4,lime,2);
 const section=Math.floor(t/6),local=t%6;ctx.save();ctx.globalAlpha=Math.min(1,local*3);ctx.translate(0,Math.max(0,1-local*3)*22);
 if(section===0){text('UNTUK IDE YANG BELUM JADI.',76,300,24,lime);lines(['Punya ide konten.','Mulai dari mana?'],76,410,74);box(76,650,928,310);text('Satu tempat untuk mulai.',120,725,36);lines(['Gambar, video, dan alur kreatif.','Kenalan dengan NexoClip.'],120,805,32,'#b6bfb2');}
 if(section===1){text('01 / MULAI DARI IDE',76,280,24,lime);lines(['Tulis yang','lo bayangin.'],76,375,76);box(76,600,928,420,'#191e18');text('Video Studio',116,665,28,lime);const prompt='Iklan produk dengan cahaya pagi yang lembut.';text(prompt.slice(0,Math.floor(local*14)),116,760,30);text('Tambahkan referensi di studio',116,830,25,'#9da69b');box(720,910,230,65,lime,32);text('Create ↗',758,952,28,'#101310');}
 if(section===2){text('02 / PILIH RUANG KREASIMU',76,280,24,lime);lines(['Satu ide.','Banyak kemungkinan.'],76,375,65);[['Image Studio','Bangun visual dan gaya.'],['Video Studio','Ubah ide menjadi gerakan.'],['AI Director','Susun alur cerita.']].forEach(([a,b],i)=>{box(76,590+i*150,928,125,i===Math.floor(local/2)?'#2c3822':'#1b201a');text(a,116,640+i*150,32,lime);text(b,116,684+i*150,25,'#bec6ba')})}
 if(section===3){text('03 / BIKIN VERSI LO SENDIRI',76,280,24,lime);lines(['Untuk konten','yang lo butuhkan.'],76,375,72);['Product ads','UGC-style videos','Cinematic shots','Product photos'].forEach((label,i)=>{box(76,590+i*120,928,95);text('0'+(i+1),112,650+i*120,24,lime);text(label,184,650+i*120,36);text('↗',920,650+i*120,30,lime)})}
 if(section>=4){text('YOUR CREATIVE STUDIO',76,320,24,lime);lines(['Ide berikutnya,','mulai di sini.'],76,445,78);box(76,710,928,130,lime,65);text('nexoclip.com ↗',150,795,66,'#101310');lines(['Cobain. Eksplorasi.','Kasih tahu apa yang lo butuhkan.'],76,960,32,'#b6bfb2')}
 ctx.restore();text('NEXOCLIP  /  CREATIVE WORKSPACE',76,1300,18,'#7d8976')}
function loop(now){draw(Math.min(29.999,((now-start)/1000)%30));requestAnimationFrame(loop)}requestAnimationFrame(loop);
button.onclick=()=>{if(recording)return;if(!canvas.captureStream||!window.MediaRecorder){status.textContent='Browser ini belum mendukung ekspor. Buka di Chrome atau Edge desktop.';return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='Format WebM tidak didukung browser ini.';return}const stream=canvas.captureStream(30),chunks=[];let recorder;try{recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000})}catch(e){stream.getTracks().forEach(t=>t.stop());status.textContent='Ekspor tidak bisa dimulai: '+e.message;return}recording=true;button.disabled=true;start=performance.now();status.textContent='Merekam 30 detik. Biarkan tab ini tetap aktif.';recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const a=document.querySelector('#download');if(a.href.startsWith('blob:'))URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download='nexoclip-linkedin-30s.webm';a.hidden=false;button.disabled=false;recording=false;status.textContent='Video siap diunduh.'};recorder.start();setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},30000)};
</script></html>
